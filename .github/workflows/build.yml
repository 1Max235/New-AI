name: Build APK
on: workflow_dispatch
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.13"}
      - run: |
          unzip -q atticus-android.zip
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null || true
          gradle -p atticus-android :app:assembleDebug
          gh release create b${{ github.run_number }} atticus-android/app/build/outputs/apk/debug/app-debug.apk -t "Atticus ${{ github.run_number }}" -n "debug build"
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
